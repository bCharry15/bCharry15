<svg xmlns="http://www.w3.org/2000/svg" width="490" height="230" viewBox="0 0 490 230" role="img" aria-label="AI Applications - Retrieval &amp; Agent Workflows" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0F19"/><stop offset="1" stop-color="#151B2E"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#06B6D4"/></linearGradient>
<filter id="bl"><feGaussianBlur stdDeviation="30"/></filter>
<clipPath id="c"><rect width="490" height="230" rx="16"/></clipPath>
</defs>
<style>
.m{font-family:'JetBrains Mono','SF Mono',Consolas,'DejaVu Sans Mono',monospace}
.s{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.g{animation:g 7s ease-in-out infinite}@keyframes g{0%,100%{transform:translate(0,0)}50%{transform:translate(-40px,20px)}}
.pill{opacity:0;animation:p .7s ease-out forwards}@keyframes p{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.sh{animation:sh 4s linear infinite}@keyframes sh{from{transform:translateX(-200px)}to{transform:translateX(690px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style>
<g clip-path="url(#c)">
<rect width="490" height="230" fill="url(#bg)"/>
<circle class="g" cx="420" cy="30" r="90" fill="#34D399" opacity="0.22" filter="url(#bl)"/>
<circle class="g" cx="40" cy="230" r="80" fill="#06B6D4" opacity="0.18" filter="url(#bl)"/>
<rect x="0" y="0" width="490" height="4" fill="url(#ac)"/>
<rect class="sh" x="0" y="0" width="120" height="4" fill="#fff" opacity="0.5"/>
</g>
<rect x="0.5" y="0.5" width="489" height="229" rx="16" fill="none" stroke="#334155"/>
<text x="32" y="64" font-size="30">🤖</text>
<text class="m" x="76" y="62" font-size="22" font-weight="700" fill="#F8FAFC">AI Applications</text>
<text class="m" x="76" y="82" font-size="12" fill="#34D399" letter-spacing="1">RETRIEVAL &amp; AGENT WORKFLOWS</text>
<text class="s" x="32" y="112" font-size="14" fill="#94A3B8">RAG, conversational memory, external tools,</text>
<text class="s" x="32" y="133" font-size="14" fill="#94A3B8">stateful LangGraph orchestration and</text>
<text class="s" x="32" y="154" font-size="14" fill="#94A3B8">human-in-the-loop flows.</text>
<rect x="32" y="152" width="67" height="26" rx="13" fill="#0F172A" stroke="#34D399" stroke-opacity="0.55"/><text class="m" x="65.5" y="169.5" text-anchor="middle" font-size="12" fill="#CBD5E1">Python</text>
<rect x="107" y="152" width="89" height="26" rx="13" fill="#0F172A" stroke="#34D399" stroke-opacity="0.55"/><text class="m" x="151.5" y="169.5" text-anchor="middle" font-size="12" fill="#CBD5E1">LangChain</text>
<rect x="204" y="152" width="89" height="26" rx="13" fill="#0F172A" stroke="#34D399" stroke-opacity="0.55"/><text class="m" x="248.5" y="169.5" text-anchor="middle" font-size="12" fill="#CBD5E1">LangGraph</text>
<rect x="301" y="152" width="45" height="26" rx="13" fill="#0F172A" stroke="#34D399" stroke-opacity="0.55"/><text class="m" x="323.5" y="169.5" text-anchor="middle" font-size="12" fill="#CBD5E1">RAG</text>
<text class="m" x="32" y="208" font-size="12.5" fill="#34D399">View repository →</text>

<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>