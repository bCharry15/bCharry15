<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="110" viewBox="0 0 1000 110" role="img" aria-label="Credentials: Universidad del Cauca, Popayán Colombia, Pull Shark, Backend AI Cloud">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0F19"/><stop offset="1" stop-color="#151B2E"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<filter id="bl"><feGaussianBlur stdDeviation="30"/></filter>
<clipPath id="c"><rect width="1000" height="110" rx="16"/></clipPath>
</defs>
<style>
.m{font-family:'JetBrains Mono','SF Mono',Consolas,'DejaVu Sans Mono',monospace}
.s{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.g{animation:g 7s ease-in-out infinite}@keyframes g{0%,100%{transform:translate(0,0)}50%{transform:translate(-40px,20px)}}
.pill{opacity:0;animation:p .7s ease-out forwards}@keyframes p{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.it{opacity:0;animation:i .8s ease-out forwards}@keyframes i{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sh{animation:sh 4s linear infinite}@keyframes sh{from{transform:translateX(-200px)}to{transform:translateX(1200px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style>
<g clip-path="url(#c)">
<rect width="1000" height="110" fill="url(#bg)"/>
<circle class="g" cx="930" cy="30" r="90" fill="#38BDF8" opacity="0.22" filter="url(#bl)"/>
<circle class="g" cx="40" cy="110" r="80" fill="#A78BFA" opacity="0.18" filter="url(#bl)"/>
<rect x="0" y="0" width="1000" height="4" fill="url(#ac)"/>
<rect class="sh" x="0" y="0" width="120" height="4" fill="#fff" opacity="0.5"/>
</g>
<rect x="0.5" y="0.5" width="999" height="109" rx="16" fill="none" stroke="#334155"/>
<g class="it" style="animation-delay:0.2s"><text x="36" y="62" font-size="30">🎓</text><text class="m" x="82" y="47" font-size="11" fill="#38BDF8" letter-spacing="2">EDUCATION</text><text class="m" x="82" y="70" font-size="15" font-weight="700" fill="#F8FAFC">Universidad del Cauca</text></g><g class="it" style="animation-delay:0.4s"><text x="278" y="62" font-size="30">📍</text><text class="m" x="324" y="47" font-size="11" fill="#38BDF8" letter-spacing="2">LOCATION</text><text class="m" x="324" y="70" font-size="15" font-weight="700" fill="#F8FAFC">Popayán, Colombia</text></g><rect x="258" y="30" width="1" height="50" fill="#334155"/><g class="it" style="animation-delay:0.6000000000000001s"><text x="520" y="62" font-size="30">🦈</text><text class="m" x="566" y="47" font-size="11" fill="#38BDF8" letter-spacing="2">ACHIEVEMENT</text><text class="m" x="566" y="70" font-size="15" font-weight="700" fill="#F8FAFC">Pull Shark</text></g><rect x="500" y="30" width="1" height="50" fill="#334155"/><g class="it" style="animation-delay:0.8s"><text x="762" y="62" font-size="30">🎯</text><text class="m" x="808" y="47" font-size="11" fill="#38BDF8" letter-spacing="2">FOCUS</text><text class="m" x="808" y="70" font-size="15" font-weight="700" fill="#F8FAFC">Backend · AI · Cloud</text></g><rect x="742" y="30" width="1" height="50" fill="#334155"/></svg>