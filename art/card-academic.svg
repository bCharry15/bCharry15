<text class="s" x="32" y="133" font-size="14" fill="#94A3B8">patterns, distributed systems and machine</text>
<text class="s" x="32" y="154" font-size="14" fill="#94A3B8">learning notebooks.</text>
<rect x="32" y="152" width="53" height="26" rx="13" fill="#0F172A" stroke="#F472B6" stroke-opacity="0.55"/><text class="m" x="58.5" y="169.5" text-anchor="middle" font-size="12" fill="#CBD5E1">Java</text>
<rect x="93" y="152" width="67" height="26" rx="13" fill="#0F172A" stroke="#F472B6" stroke-opacity="0.55"/><text class="m" x="126.5" y="169.5" text-anchor="middle" font-size="12" fill="#CBD5E1">Spring</text>
<rect x="168" y="152" width="45" height="26" rx="13" fill="#0F172A" stroke="#F472B6" stroke-opacity="0.55"/><text class="m" x="190.5" y="169.5" text-anchor="middle" font-size="12" fill="#CBD5E1">SQL</text>
