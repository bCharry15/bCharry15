<svg xmlns="http://www.w3.org/2000/svg" width="490" height="230" viewBox="0 0 490 230" role="img" aria-label="Energy Predict - Residential Energy Analysis">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0F19"/><stop offset="1" stop-color="#151B2E"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FBBF24"/><stop offset="1" stop-color="#F97316"/></linearGradient>
<filter id="bl"><feGaussianBlur stdDeviation="30"/></filter>
<clipPath id="c"><rect width="490" height="230" rx="16"/></clipPath>
</defs>
<style>
.m{font-family:'JetBrains Mono','SF Mono',Consolas,'DejaVu Sans Mono',monospace}
.s{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.g{animation:g 7s ease-in-out infinite}@keyframes g{0%,100%{transform:translate(0,0)}50%{transform:translate(-40px,20px)}}
.pill{opacity:0;animation:p .7s ease-out forwards}@keyframes p{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.it{opacity:0;animation:i .8s ease-out forwards}@keyframes i{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sh{animation:sh 4s linear infinite}@keyframes sh{from{transform:translateX(-200px)}to{transform:translateX(690px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style>
<g clip-path="url(#c)">
<rect width="490" height="230" fill="url(#bg)"/>
<circle class="g" cx="420" cy="30" r="90" fill="#FBBF24" opacity="0.22" filter="url(#bl)"/>
<circle class="g" cx="40" cy="230" r="80" fill="#F97316" opacity="0.18" filter="url(#bl)"/>
<rect x="0" y="0" width="490" height="4" fill="url(#ac)"/>
<rect class="sh" x="0" y="0" width="120" height="4" fill="#fff" opacity="0.5"/>
</g>
<rect x="0.5" y="0.5" width="489" height="229" rx="16" fill="none" stroke="#334155"/>
<text x="32" y="64" font-size="30">⚡</text>
<text class="m" x="76" y="62" font-size="22" font-weight="700" fill="#F8FAFC">Energy Predict</text>
<text class="m" x="76" y="82" font-size="12" fill="#FBBF24" letter-spacing="1">RESIDENTIAL ENERGY ANALYSIS</text>
<text class="s" x="32" y="112" font-size="14" fill="#94A3B8">Electricity analytics for Popayán: linear regression,</text>
<text class="s" x="32" y="133" font-size="14" fill="#94A3B8">exceedance probability and Monte Carlo</text>
<text class="s" x="32" y="154" font-size="14" fill="#94A3B8">simulations for bill scenarios.</text>
<rect x="32" y="162" width="67" height="26" rx="13" fill="#0F172A" stroke="#FBBF24" stroke-opacity="0.55"/><text class="m" x="65.5" y="179.5" text-anchor="middle" font-size="12" fill="#CBD5E1">Python</text>
<rect x="107" y="162" width="89" height="26" rx="13" fill="#0F172A" stroke="#FBBF24" stroke-opacity="0.55"/><text class="m" x="151.5" y="179.5" text-anchor="middle" font-size="12" fill="#CBD5E1">Streamlit</text>
<rect x="204" y="162" width="67" height="26" rx="13" fill="#0F172A" stroke="#FBBF24" stroke-opacity="0.55"/><text class="m" x="237.5" y="179.5" text-anchor="middle" font-size="12" fill="#CBD5E1">SQLite</text>
<rect x="279" y="162" width="67" height="26" rx="13" fill="#0F172A" stroke="#FBBF24" stroke-opacity="0.55"/><text class="m" x="312.5" y="179.5" text-anchor="middle" font-size="12" fill="#CBD5E1">Plotly</text>
<text class="m" x="32" y="208" font-size="12.5" fill="#FBBF24">View repository →</text>
</svg>