<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Brayan Charry - Systems Engineering student, Backend and Web Developer" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FAFC"/><stop offset="0.55" stop-color="#E0E7FF"/><stop offset="1" stop-color="#BAE6FD"/></linearGradient>
<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#6366F1" stroke-opacity="0.12" stroke-width="1"/></pattern>
<filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
<clipPath id="r"><rect width="1280" height="320" rx="18"/></clipPath>
</defs>
<style>
.f{font-family:'JetBrains Mono','SF Mono',Consolas,'DejaVu Sans Mono',monospace}
.in{opacity:0;animation:in 1s ease-out forwards}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.d1{animation-delay:.2s}.d2{animation-delay:.6s}.d3{animation-delay:1s}.d4{animation-delay:1.4s}
.o1{animation:fl 9s ease-in-out infinite}.o2{animation:fl 11s ease-in-out infinite reverse}
@keyframes fl{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,25px)}}
.cur{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.scan{animation:sc 6s linear infinite}@keyframes sc{from{transform:translateX(-300px)}to{transform:translateX(1580px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style>
<g clip-path="url(#r)">
<rect width="1280" height="320" fill="url(#bg)"/>
<rect width="1280" height="320" fill="url(#grid)"/>
<circle class="o1" cx="260" cy="90" r="110" fill="#7C3AED" opacity="0.35" filter="url(#blur)"/>
<circle class="o2" cx="1020" cy="240" r="130" fill="#06B6D4" opacity="0.35" filter="url(#blur)"/>
<rect class="scan" x="0" y="0" width="140" height="320" fill="url(#ln)" opacity="0.07"/>
<text class="f in d1" x="640" y="70" text-anchor="middle" font-size="15" fill="#0369A1" letter-spacing="6">&lt;/&gt; WELCOME TO MY PROFILE</text>
<text class="f in d2" x="640" y="145" text-anchor="middle" font-size="58" font-weight="700" fill="#0F172A">Brayan Charry</text>
<rect class="in d3" x="470" y="165" width="340" height="3" rx="2" fill="url(#ln)"/>
<text class="f in d3" x="640" y="210" text-anchor="middle" font-size="20" fill="#0369A1">Systems Engineering Student · Backend &amp; Web Developer<tspan class="cur">_</tspan></text>
<g class="in d4">
<rect x="355" y="245" width="140" height="34" rx="17" fill="#FFFFFF" stroke="#CBD5E1"/><text class="f" x="425" y="267" text-anchor="middle" font-size="14" fill="#475569">Java · Spring</text>
<rect x="510" y="245" width="120" height="34" rx="17" fill="#FFFFFF" stroke="#CBD5E1"/><text class="f" x="570" y="267" text-anchor="middle" font-size="14" fill="#475569">Go · Vue</text>
<rect x="645" y="245" width="130" height="34" rx="17" fill="#FFFFFF" stroke="#CBD5E1"/><text class="f" x="710" y="267" text-anchor="middle" font-size="14" fill="#475569">Angular · TS</text>
<rect x="790" y="245" width="135" height="34" rx="17" fill="#FFFFFF" stroke="#CBD5E1"/><text class="f" x="857" y="267" text-anchor="middle" font-size="14" fill="#475569">AI · RAG · Py</text>
</g>
</g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>