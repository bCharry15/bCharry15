<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-label="PiedraAzul - Medical Appointment Management">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0F19"/><stop offset="1" stop-color="#151B2E"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#6366F1"/></linearGradient>
<filter id="bl"><feGaussianBlur stdDeviation="30"/></filter>
<clipPath id="c"><rect width="1000" height="230" rx="16"/></clipPath>
</defs>
<style>
.m{font-family:'JetBrains Mono','SF Mono',Consolas,'DejaVu Sans Mono',monospace}
.s{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.g{animation:g 7s ease-in-out infinite}@keyframes g{0%,100%{transform:translate(0,0)}50%{transform:translate(-40px,20px)}}
.pill{opacity:0;animation:p .7s ease-out forwards}@keyframes p{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.it{opacity:0;animation:i .8s ease-out forwards}@keyframes i{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sh{animation:sh 4s linear infinite}@keyframes sh{from{transform:translateX(-200px)}to{transform:translateX(1200px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style>
<g clip-path="url(#c)">
<rect width="1000" height="230" fill="url(#bg)"/>
<circle class="g" cx="930" cy="30" r="90" fill="#38BDF8" opacity="0.22" filter="url(#bl)"/>
<circle class="g" cx="40" cy="230" r="80" fill="#6366F1" opacity="0.18" filter="url(#bl)"/>
<rect x="0" y="0" width="1000" height="4" fill="url(#ac)"/>
<rect class="sh" x="0" y="0" width="120" height="4" fill="#fff" opacity="0.5"/>
</g>
<rect x="0.5" y="0.5" width="999" height="229" rx="16" fill="none" stroke="#334155"/>
<text x="32" y="64" font-size="30">🏥</text>
<text class="m" x="76" y="62" font-size="22" font-weight="700" fill="#F8FAFC">PiedraAzul</text>
<text class="m" x="76" y="82" font-size="12" fill="#38BDF8" letter-spacing="1">MEDICAL APPOINTMENT MANAGEMENT</text>
<text class="s" x="32" y="112" font-size="14" fill="#94A3B8">Scheduling, doctor availability, appointment history and CSV</text>
<text class="s" x="32" y="133" font-size="14" fill="#94A3B8">exports, with dedicated portals for admins, schedulers,</text>
<text class="s" x="32" y="154" font-size="14" fill="#94A3B8">doctors and patients.</text>
<rect x="32" y="162" width="53" height="26" rx="13" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.55"/><text class="m" x="58.5" y="179.5" text-anchor="middle" font-size="12" fill="#CBD5E1">Java</text>
<rect x="93" y="162" width="104" height="26" rx="13" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.55"/><text class="m" x="145.0" y="179.5" text-anchor="middle" font-size="12" fill="#CBD5E1">Spring Boot</text>
<rect x="205" y="162" width="75" height="26" rx="13" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.55"/><text class="m" x="242.5" y="179.5" text-anchor="middle" font-size="12" fill="#CBD5E1">Angular</text>
<rect x="288" y="162" width="82" height="26" rx="13" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.55"/><text class="m" x="329.0" y="179.5" text-anchor="middle" font-size="12" fill="#CBD5E1">Keycloak</text>
<rect x="378" y="162" width="75" height="26" rx="13" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.55"/><text class="m" x="415.5" y="179.5" text-anchor="middle" font-size="12" fill="#CBD5E1">MariaDB</text>
<rect x="461" y="162" width="67" height="26" rx="13" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.55"/><text class="m" x="494.5" y="179.5" text-anchor="middle" font-size="12" fill="#CBD5E1">Docker</text>
<text class="m" x="32" y="208" font-size="12.5" fill="#38BDF8">View repository →</text>
<rect x="686" y="28" width="1" height="174" fill="#334155"/><g class="pill" style="animation-delay:0.5s"><rect x="710" y="40" width="250" height="34" rx="10" fill="#0F172A" stroke="#334155"/><circle cx="730" cy="57" r="4" fill="#38BDF8"/><text class="m" x="746" y="62" font-size="13" fill="#E2E8F0">Modular monolith</text></g><g class="pill" style="animation-delay:0.6799999999999999s"><rect x="710" y="84" width="250" height="34" rx="10" fill="#0F172A" stroke="#334155"/><circle cx="730" cy="101" r="4" fill="#38BDF8"/><text class="m" x="746" y="106" font-size="13" fill="#E2E8F0">Ports &amp; adapters</text></g><g class="pill" style="animation-delay:0.86s"><rect x="710" y="128" width="250" height="34" rx="10" fill="#0F172A" stroke="#334155"/><circle cx="730" cy="145" r="4" fill="#38BDF8"/><text class="m" x="746" y="150" font-size="13" fill="#E2E8F0">Keycloak + JWT security</text></g><g class="pill" style="animation-delay:1.04s"><rect x="710" y="172" width="250" height="34" rx="10" fill="#0F172A" stroke="#334155"/><circle cx="730" cy="189" r="4" fill="#38BDF8"/><text class="m" x="746" y="194" font-size="13" fill="#E2E8F0">JUnit 5 + Mockito tests</text></g></svg>